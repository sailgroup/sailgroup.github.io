# news.yml
# ---------------------------------------------------------------------------
# SAIL news feed, shown on the News page (/news/), newest first.
#
# HOW TO ADD AN ITEM (no coding needed, edit this file on GitHub):
#   1. Copy one block below (from "- date:" down to the blank line).
#   2. Paste it anywhere in the list and fill in the fields. Order does not
#      matter: the page always sorts by date, newest first.
#   3. Commit. The site rebuilds and the item appears automatically.
#
# FIELDS
#   date         REQUIRED. "YYYY-MM-DD". Controls the order (newest first).
#                If you only know the month or year, use 01 for the missing
#                part and set display_date so the guess is not shown.
#   display_date OPTIONAL. Shown in place of date when set, e.g. "March 2025"
#                or "2026". Leave "" to show the full date.
#   category     one of: people | publication | award | talk | event
#   title        REQUIRED. One line.
#   body         OPTIONAL. A sentence or two of detail. Leave "" to omit.
#   link         OPTIONAL. A page on this site ("/publications/41/") or a full
#                URL ("https://..."). Full URLs open in a new tab.
#   link_text    OPTIONAL. Link label. Defaults to "Details".
#   links        OPTIONAL. More links on the same line, after `link`: a news story
#                about the item, press articles. Each one is a `text` and a `url`
#                (a full URL opens in a new tab, like `link`):
#                  links:
#                    - text: "Kookmin University news"
#                      url: "https://www.kookmin.ac.kr/..."
#   links_label  OPTIONAL. A word or two shown before `links`, e.g. "In the press"
#                (the colon is added).
# ---------------------------------------------------------------------------

- date: "2026-10-30"
  display_date: ""
  category: publication
  title: "Jihwan's MEMo paper published in Chemical Engineering Journal"
  body: "Congratulations to Jihwan and Chanjoong on the publication of MEMo (Mixture Embedding via Mole Fraction), a graph-based model that conditions molecular representations on mixture composition during encoding to predict the properties of liquid mixtures. Jihwan led this work as first author, and Chanjoong contributed to the machine learning methodology."
  link: "/publications/47/"
  link_text: "Read the paper"
  
- date: "2026-09-10"
  display_date: ""
  category: publication
  title: "Jihwan co-authors new paper on perovskite nanocrystals"
  body: "Congratulations to Jihwan on the publication of \"Synergistic Ligand and Composition Control for Bright and Stable CsPbBr3/Cs4PbBr6 Core/Shell Colloidal Perovskite Nanocrystals\"! Jihwan contributed to the machine learning part of this collaborative study, developing a random forest model to predict successful core/shell formation and guide the optimization of synthesis conditions."
  link: "/publications/45/"
  link_text: "Read the paper"

