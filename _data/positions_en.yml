# Positions 영어판(/positions/en/)의 모든 문구입니다(D61). 한국어판(/positions/, positions.yml)이
# 기본이자 원문이고, 이 파일은 그 번역입니다. positions.yml 을 고치면 이 파일의 같은 자리도 같이
# 고쳐 주세요. 두 파일의 역할 · 문단 · 카드 수가 다르면 빌드 로그에 경고가 나옵니다.
#
# 구조는 positions.yml 과 같습니다(intro, sections 의 title · paragraphs · projects_title ·
# projects). 그룹 가이드 주소는 positions.yml 의 guide_url 을 같이 씁니다.
#
# labels: 본문 밖에서 페이지가 쓰는 말
#   guide_phrase  본문에 이 말을 쓰면 그룹 가이드로 링크됩니다(한국어판의 '그룹 가이드')
#   guide_button  가이드를 여는 버튼의 글(가이드 문서는 한국어입니다)
#   requires      카드의 requires 앞에 붙는 말(한국어판의 '필요 지식:')
labels:
  guide_phrase: group guide
  guide_button: Group guide (in Korean)
  requires: "Requirements:"

intro: >-
  If you are interested in our lab, please start by reading the group guide, to see the values
  the lab considers important and how I approach research and mentoring.

sections:
  - title: Postdoctoral Researchers
    paragraphs:
      - >-
        If you would like to apply as a postdoctoral researcher, please email your CV with a
        short introduction to your research interests and experience. Please also describe
        your long-term research goals, the research you hope to accomplish in our lab, and
        what you hope to learn here. Even if the lab has no postdoctoral position open, we keep
        your application and may contact you individually if a suitable position opens later.
        If you have secured independent funding or a fellowship, please mention it as well.
      - >-
        Open postdoctoral positions are posted on this page by research topic. When we begin
        recruiting for a new position, we will announce it here.

  - title: Graduate Students
    paragraphs:
      - >-
        Our lab plans to select 1 to 3 graduate students each year, and the number may vary
        with the lab's research topics and funding. If you are interested in the lab, we
        recommend that you read the group guide before applying and consider carefully whether
        your research interests and career goals fit the lab. In particular, please write the
        IDP (Individual Development Plan) described in the guide, and email me for a
        consultation before you apply.

  - title: Undergraduate Researchers
    paragraphs:
      - >-
        If you would like to take part in research as an undergraduate researcher, please look
        through the research areas and recent papers on the lab website, then email us with
        the research topics you are interested in. Among third- and fourth-year students,
        priority may go to those who have taken the AI Materials Chemistry course. Even
        without research experience, you are always welcome if you are eager to learn and
        diligent. We especially encourage students who are considering graduate school to
        apply.
      - >-
        Developing a new AI model and reaching a meaningful research result during a short
        school break is not easy. The most important foundation of AI research, on the other hand,
        is high-quality data. Short-term undergraduate researchers therefore often work on
        projects such as building databases or improving data quality. This work can feel
        somewhat repetitive, but it is the most important starting point for new AI models
        and research results.
      - >-
        Students who intend to keep doing research after the break are given more advanced
        topics, such as developing machine learning models or implementing algorithms,
        depending on the project's progress and their abilities.
    projects_title: Open Undergraduate Projects
    projects:
      - title: Expanding the dataset for the FlowER reaction prediction model
        body: >-
          The performance of the latest AI models depends heavily on the quality and scale of
          the data, even more than on the algorithm. This project builds and validates new reaction data
          so that FlowER can learn a wider range of organic reactions and reaction mechanisms.
        requires: Organic chemistry
      - title: Building a database that pairs IR / Raman / MS / NMR spectra with molecular structures
        body: >-
          Predicting a molecule's structure from its spectra alone is one of the central goals
          of analytical chemistry. AI models for this task need large amounts of data that pair
          spectra with molecular structures. This project uses the published literature and
          public databases to build datasets for training AI.
        requires: Organic chemistry, spectroscopy of organic materials
      - title: Developing an LLM-based platform that automates data extraction from the literature
        body: >-
          Chemistry papers hold a vast amount of data that machine learning could use, but
          collecting it by hand takes a great deal of time. This project develops a platform
          that uses the latest LLMs to extract chemical data from the literature automatically
          and structure it.
        requires: Interest in Python programming and in using LLMs
      - title: Building new databases for AI for Chemistry
        body: >-
          This project systematically compiles a wide range of chemical data and manages its
          quality. Databases are the starting point of every AI model, and well-built datasets
          become the foundation of new research and papers.
        requires: Basic knowledge of chemistry and attention to detail
