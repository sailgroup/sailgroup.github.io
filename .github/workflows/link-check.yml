name: Link check

# Once a month, every outside link in the site's data (_data/*.yml) is checked: DOIs through
# doi.org's API (publishers' pages refuse scripts), GitHub and ORCID through theirs, other
# pages directly, one request at a time per site (.github/scripts/check-links.mjs). The ones
# that need a look are listed in one issue, "Link check: N links need a look" (label
# link-check), which each check updates and the first one that finds nothing closes.
# Schedules run only from the default branch. This is a workflow of its own because GitHub
# turns a scheduled workflow off after 60 days without activity in a public repository,
# which must never touch the deploy workflow.
on:
  schedule:
    - cron: "23 1 3 * *" # the 3rd of each month, 01:23 UTC (10:23 in Korea)
  workflow_dispatch:

# Nothing at the workflow level; the job gets only what it needs.
permissions: {}

# Run JavaScript actions on Node 24, as deploy.yml does (GitHub is removing Node 20).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A run started by hand while the monthly one is going waits for it, so there is one issue.
concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Read the repository; open, update or close the issue (and make its label once).
    permissions:
      contents: read
      issues: write
    steps:
      # Pinned to the same commits as deploy.yml; Dependabot updates both.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check the links and report them in an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix .github/scripts --no-audit --no-fund
          node .github/scripts/check-links.mjs
