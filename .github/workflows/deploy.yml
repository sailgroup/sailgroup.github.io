name: Build and deploy site

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow as a whole only needs to read the repo. The
# Pages/OIDC write scopes are granted to the deploy job alone (see below).
permissions:
  contents: read

# Run JavaScript actions on Node 24. The Node 20 runtime these actions ship with is being
# removed from GitHub runners; this opts every JS action in the workflow into Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One run at a time per branch, and never cancel one in progress (a deploy included).
# Per branch because a group keeps only one waiting run and cancels the one before it:
# with a single group for every branch, a push to dev made while main was building
# could cancel the waiting main run, and that main commit would never be published.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A fixed runner image rather than ubuntu-latest: setup-ruby below is pinned to one
    # release, which only knows the runner images that existed when it was made.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Images: shrink oversized uploads, remove camera metadata (e.g. GPS position), and
      # make the smaller renditions pages offer through srcset (.github/scripts/
      # prepare-images.mjs). It changes only this run's working copy, before the build;
      # the repository keeps the files as uploaded. On main it is optional: if it fails for
      # any reason, the site builds and deploys with the plain image files. On dev and on
      # pull requests (Dependabot's included) a failure fails the run, and so does an image
      # the script could not process (IMAGES_STRICT), so an update that breaks this step
      # shows before it is merged. The step timeouts keep a stalled download from using up
      # the job's own timeout (which would stop the deploy).
      - name: Set up Node (image step)
        uses: actions/setup-node@v7
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 5
        with:
          node-version: "24"

      - name: Prepare images
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 5
        env:
          IMAGES_STRICT: ${{ github.ref != 'refs/heads/main' }}
        run: |
          npm ci --prefix .github/scripts --no-audit --no-fund
          node .github/scripts/prepare-images.mjs assets/images _data/generated_images.json

      # Pinned to a commit (third-party action; the tag it came from is in the comment).
      # bundler-cache installs exactly the gems in the committed Gemfile.lock (deployment
      # mode) and caches them.
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      # Fail the build on a broken internal link, image, or script reference
      # (e.g. a typo'd path, or assets/js/*.js accidentally excluded again).
      # External URLs (DOIs, Scholar, ORCID) are not checked here -- they are
      # slow/flaky in CI and verified separately.
      - name: Check internal links and images
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-empty-alt \
            --allow-hash-href \
            --no-enforce-https

      # include-hidden-files: v4+ of this action drops dotfiles by default, which
      # would silently remove /.well-known/security.txt from the deployed site.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  # Deploy only from main, so pushes to dev verify the build without publishing.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
