name: Build and deploy site

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow as a whole only needs to read the repo. The
# Pages/OIDC write scopes are granted to the deploy job alone (see below).
permissions:
  contents: read

# Run JavaScript actions on Node 24. The Node 20 runtime these actions ship with is being
# removed from GitHub runners; this opts every JS action in the workflow into Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One deploy at a time; do not cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      # Fail the build on a broken internal link, image, or script reference
      # (e.g. a typo'd path, or assets/js/*.js accidentally excluded again).
      # External URLs (DOIs, Scholar, ORCID) are not checked here -- they are
      # slow/flaky in CI and verified separately.
      - name: Check internal links and images
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-empty-alt \
            --allow-hash-href \
            --no-enforce-https

      # Shrink oversized uploads (people/, photos/, pubs/) in the built copy only; the
      # repository originals stay as uploaded. Optional: if this step fails for any
      # reason, the site still deploys with the original images.
      - name: Set up Node (image optimization)
        uses: actions/setup-node@v7
        continue-on-error: true
        with:
          node-version: "24"

      - name: Optimize images in the built site
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.35
          node .github/scripts/optimize-images.mjs _site/assets/images

      # include-hidden-files: v4+ of this action drops dotfiles by default, which
      # would silently remove /.well-known/security.txt from the deployed site.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  # Deploy only from main, so pushes to dev verify the build without publishing.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
