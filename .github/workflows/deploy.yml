name: Build and deploy site

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow as a whole only needs to read the repo. The
# Pages/OIDC write scopes are granted to the deploy job alone (see below).
permissions:
  contents: read

# Run JavaScript actions on Node 24. The Node 20 runtime these actions ship with is being
# removed from GitHub runners; this opts every JS action in the workflow into Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One run at a time per branch, and never cancel one in progress (a deploy included).
# Per branch because a group keeps only one waiting run and cancels the one before it:
# with a single group for every branch, a push to dev made while main was building
# could cancel the waiting main run, and that main commit would never be published.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A fixed runner image rather than ubuntu-latest: setup-ruby below is pinned to one
    # release, which only knows the runner images that existed when it was made.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The IndexNow list for the deploy job (the last step below; main only).
    outputs:
      indexnow_host: ${{ steps.indexnow.outputs.host }}
      indexnow_key: ${{ steps.indexnow.outputs.key }}
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      # Every action in this workflow is pinned to a commit, with the release it came from in
      # the comment, so a tag that is moved later cannot change what runs. Dependabot
      # (.github/dependabot.yml, monthly) updates the commit and the comment together.
      # persist-credentials: no later step uses git with the token, so it is not left in
      # .git/config for the steps that follow (npm ci, the build).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Images: shrink oversized uploads, remove camera metadata (e.g. GPS position), and
      # make the smaller renditions pages offer through srcset (.github/scripts/
      # prepare-images.mjs). It changes only this run's working copy, before the build;
      # the repository keeps the files as uploaded. On main it is optional: if it fails for
      # any reason, the site builds and deploys with the plain image files. On dev and on
      # pull requests (Dependabot's included) a failure fails the run, and so does an image
      # that errors while being processed (IMAGES_STRICT; a HEIC, TIFF or DNG upload only
      # warns), so an update that breaks this step shows before it is merged. The step
      # timeouts keep a stalled download from using up the job's own timeout (which would
      # stop the deploy).
      - name: Set up Node (image step)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 5
        with:
          node-version: "24"

      - name: Prepare images
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 5
        env:
          IMAGES_STRICT: ${{ github.ref != 'refs/heads/main' }}
        run: |
          npm ci --prefix .github/scripts --no-audit --no-fund
          node .github/scripts/prepare-images.mjs assets/images _data/generated_images.json

      # bundler-cache installs exactly the gems in the committed Gemfile.lock (deployment
      # mode) and caches them.
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      # Fail the build on a broken internal link, image, or script reference
      # (e.g. a typo'd path, or assets/js/*.js accidentally excluded again).
      # External URLs (DOIs, Scholar, ORCID) are not checked here, as they are slow
      # and flaky in CI: the monthly link check (link-check.yml) checks them.
      - name: Check internal links and images
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-empty-alt \
            --allow-hash-href \
            --no-enforce-https

      # Accessibility: axe-core checks every page of the build (the redirect stubs aside)
      # against WCAG 2.2 A and AA, and the phone menu once, in the Chrome the runner carries
      # (.github/scripts/check-a11y.mjs). Like the image step, it is strict on dev and on pull
      # requests, where a violation fails the run, and only warns on main, so a content push
      # always deploys. The image step installed the scripts' packages; if it failed on main
      # before that, they are installed here.
      - name: Check accessibility (axe-core)
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        timeout-minutes: 5
        env:
          A11Y_STRICT: ${{ github.ref != 'refs/heads/main' }}
        run: |
          test -d .github/scripts/node_modules/puppeteer-core || npm ci --prefix .github/scripts --no-audit --no-fund
          node .github/scripts/check-a11y.mjs _site

      # include-hidden-files: v4+ of this action drops dotfiles by default, which
      # would silently remove /.well-known/security.txt from the deployed site.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      # IndexNow, part 1 (main only, before the deploy job publishes this build): list the
      # pages that differ from the live site, for the deploy job to report once they are
      # live (.github/scripts/indexnow.mjs). It never fails the run; when it fails, nothing
      # is reported and the deploy goes ahead as usual.
      - name: List the pages this deploy changes (IndexNow)
        id: indexnow
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 3
        run: node .github/scripts/indexnow.mjs _site >> "$GITHUB_OUTPUT"

  # Deploy only from main, so pushes to dev verify the build without publishing.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # IndexNow, part 2: tell Bing (which passes the list to the other IndexNow engines)
      # and Naver which pages just changed, so they recrawl them soon. Naver had indexed one
      # page of this site in October 2026. The values come in through env, never pasted into
      # the script. A refused request (any answer but 200 or 202) shows as a warning on the
      # run's page; the site is already published by then, so it changes nothing else.
      - name: Tell search engines which pages changed (IndexNow)
        if: needs.build.outputs.indexnow_urls != ''
        continue-on-error: true
        timeout-minutes: 2
        env:
          HOST: ${{ needs.build.outputs.indexnow_host }}
          KEY: ${{ needs.build.outputs.indexnow_key }}
          URLS: ${{ needs.build.outputs.indexnow_urls }}
        run: |
          printf '%s\n' "$URLS" | jq -R . | jq -s --arg host "$HOST" --arg key "$KEY" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: map(select(length > 0))}' > indexnow.json
          n=$(jq '.urlList | length' indexnow.json)
          for endpoint in https://api.indexnow.org/indexnow https://searchadvisor.naver.com/indexnow; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
              -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json "$endpoint" || true)
            echo "IndexNow: $n URLs to $endpoint, HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
            case "$code" in 200|202) ;; *) echo "::warning title=IndexNow::$endpoint answered HTTP $code" ;; esac
          done
