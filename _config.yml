# --- Site identity ---------------------------------------------------------
title: Spectroscopy and AI Lab
short_name: SAIL
tagline: SAIL at Kookmin University
description: >-
  SAIL (Spectroscopy and AI Lab) at Kookmin University, led by Joonyoung F.
  Joung. We develop machine learning methods for molecular property prediction,
  chemical reaction prediction, de novo molecular design, and chemical databases.
url: "https://sail.kookmin.ac.kr"
baseurl: ""
lang: en
# og:locale for link previews, in the language_TERRITORY form ogp.me asks for (a bare
# `en` is not). A Korean page sets its own `locale: ko_KR` next to `lang: ko`, because
# this site-wide value outranks a page's `lang` in jekyll-seo-tag.
locale: en_US
timezone: Asia/Seoul
logo: /assets/images/sail-logo.png

# --- Build -----------------------------------------------------------------
markdown: kramdown
permalink: pretty
sass:
  style: compressed

# Member, alumni, and publication detail pages are generated from _data/*.yml by
# _plugins/generate_pages.rb (one YAML entry = one page; no collection stubs).

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png

# No jekyll-feed: it only reads blog posts, and this site has none (news lives in
# _data/news.yml), so it published an empty /feed.xml advertised on every page.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Jekyll skips dotfolders by default; force-include the RFC 9116 security.txt.
include:
  - ".well-known"

exclude:
  - _source/
  - vendor/
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - CLAUDE.md
  - DECISIONS.md
  - PROGRESS.md
  - CONTENT_INVENTORY.md
  - REVIEW.md
  - REFACTOR_PLAN.md
  - CONTRIBUTING.md
  # Do NOT add blanket globs like "*.js" or "*.ps1" here: Jekyll matches them against
  # nested paths too, which silently dropped assets/js/*.js from the build and broke the
  # publication filter, mobile nav, and photo lightbox. Root-level one-off helper scripts
  # are kept out of the repo via .gitignore instead, so they never reach the CI build.

# --- SEO --------------------------------------------------------------------
# No `twitter:` block on purpose: the lab has no X/Twitter account, and an empty
# one made jekyll-seo-tag emit a bogus `twitter:site` ("@") and a `twitter:creator`
# built from the author name. With no `twitter:` key, seo-tag still defaults
# `twitter:card` to summary_large_image, so link previews keep the large image.
#
# The site's author is the lab, as an Organization. jekyll-seo-tag also names its
# JSON-LD `publisher` (with `logo` above) after the author, so a person here made every
# page claim an Organization called "Joonyoung F. Joung". `type` must be exactly
# Organization or Person (seo-tag drops any other value). No `social:` block: seo-tag
# turns its links into the home page's sameAs, which must identify the site itself,
# and the PI's Scholar/ORCID profiles identify the PI (they are on the PI's JSON-LD).
author:
  name: Spectroscopy and AI Lab
  type: Organization
  url: https://sail.kookmin.ac.kr/
